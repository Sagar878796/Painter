name: JSON to M3U Converter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JSON
        run: |
          curl -L --fail \
            "https://lemajekaat.streamxlive.workers.dev/" \
            -o source.json

      - name: Convert JSON to M3U
        run: |
          python3 - <<'PY'
          import json

          with open("source.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              data = data.get("channels", data.get("data", []))

          lines = ["#EXTM3U"]

          for ch in data:
              name = ch.get("name", ch.get("title", "Unknown"))
              url = ch.get("url", ch.get("stream_url", ch.get("link", "")))
              logo = ch.get("logo", ch.get("tvg-logo", ""))
              category = ch.get("category", ch.get("group", "Other"))
              channel_id = ch.get("id", "")

              if not url:
                  continue

              lines.append(
                  f'#EXTINF:-1 tvg-id="{channel_id}" '
                  f'tvg-name="{name}" tvg-logo="{logo}" '
                  f'group-title="{category}",{name}'
              )
              lines.append(url)

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Converted {len(lines)//2} entries")
          PY

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Update M3U playlist"
          git push
